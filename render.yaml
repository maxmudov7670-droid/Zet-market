services:
  - type: web
    runtime: node
    name: zet-market-backend
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: MINIAPP_URL
        value: https://zet-market-miniapp.onrender.com
      - key: ADMIN_PASSWORD
        sync: false
      # Click/Payme/kuryer guruhi — hozircha bo'sh, keyin qo'shiladi (pastdagi izohga qarang)
      - key: CLICK_MERCHANT_ID
        sync: false
      - key: CLICK_SERVICE_ID
        sync: false
      - key: CLICK_SECRET_KEY
        sync: false
      - key: PAYME_MERCHANT_ID
        sync: false
      - key: PAYME_KEY
        sync: false
      - key: COURIER_CHAT_ID
        sync: false
      - key: STAFF_CHAT_ID
        sync: false
      # Admin Panelda mahsulot rasmini galereyadan yuklash uchun (Cloudinary, bepul)
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

  - type: web
    runtime: static
    name: zet-market-miniapp
    rootDir: miniapp
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://zet-market-backend.onrender.com

  - type: web
    runtime: static
    name: zet-market-admin
    rootDir: admin
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://zet-market-backend.onrender.com
